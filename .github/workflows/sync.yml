name: Stage official Codex Desktop for domestic mirrors

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: z8-codex-desktop-staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download-windows:
    name: Download Codex Desktop Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out resolver
        uses: actions/checkout@v4

      - name: Resolve and download complete MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $architecture = 'x64'
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          $resolvedText = & pwsh -NoProfile -File scripts/resolve-codex-msix.ps1 -Architecture $architecture
          if ($LASTEXITCODE -ne 0) {
            throw 'Microsoft Store resolver failed for x64'
          }
          $resolved = ($resolvedText -join "`n") | ConvertFrom-Json
          $candidates = @($resolved.urls)
          if ($candidates.Count -eq 0 -and $resolved.url) {
            $candidates = @($resolved.url)
          }

          $outputName = 'Codex-windows-x64.msix'
          $outputPath = Join-Path $artifactRoot $outputName
          $downloaded = $false
          foreach ($candidate in $candidates) {
            if ([string]::IsNullOrWhiteSpace([string]$candidate)) { continue }
            Remove-Item -LiteralPath $outputPath -Force -ErrorAction SilentlyContinue
            $curlArgs = @(
              '-fsSL', '--retry', '4', '--retry-all-errors',
              '-A', 'Mozilla/5.0 (Z8-Launch mirror staging)',
              '-e', 'https://openai.com/codex/for-work/',
              '-o', $outputPath, [string]$candidate
            )
            if ([string]$candidate -like '*dl.delivery.mp.microsoft.com*') {
              $curlArgs = @('--insecure') + $curlArgs
            }
            & curl.exe @curlArgs
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $outputPath)) { continue }

            $size = (Get-Item -LiteralPath $outputPath).Length
            if ($size -lt 104857600) { continue }
            $expectedSize = [int64]($resolved.size)
            if ($expectedSize -gt 0 -and $size -ne $expectedSize) { continue }
            $hash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedHash = [string]($resolved.sha256)
            if (-not [string]::IsNullOrWhiteSpace($expectedHash) -and $hash -ne $expectedHash.ToLowerInvariant()) { continue }
            $downloaded = $true
            break
          }
          if (-not $downloaded) {
            throw 'Unable to download a complete Codex Desktop x64 MSIX'
          }

          $metadata = [ordered]@{
            schemaVersion = 1
            architecture = $architecture
            version = [string]$resolved.version
            fileName = $outputName
            sizeBytes = $size
            sha256 = $hash
            upstreamUrl = 'https://get.microsoft.com/installer/download/9PLM9XGG6VKS?cid=website_cta_psi'
            generatedAt = [DateTime]::UtcNow.ToString('o')
          }
          $metadata | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $artifactRoot 'Codex-windows-x64.json') -Encoding utf8

      - name: Store verified MSIX for staging release
        uses: actions/upload-artifact@v4
        with:
          name: codex-msix-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  publish-staging-release:
    name: Publish versioned staging release
    needs: download-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download verified Windows package
        uses: actions/download-artifact@v4
        with:
          name: codex-msix-x64
          path: staging

      - name: Revalidate and publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          metadata='staging/Codex-windows-x64.json'
          package='staging/Codex-windows-x64.msix'
          test -f "${metadata}"
          test -f "${package}"

          version="$(jq -r '.version // empty' "${metadata}")"
          expected_size="$(jq -r '.sizeBytes // 0' "${metadata}")"
          expected_sha="$(jq -r '.sha256 // empty' "${metadata}")"
          [[ "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          [[ "${expected_size}" =~ ^[1-9][0-9]*$ ]]
          [[ "${expected_sha}" =~ ^[0-9a-f]{64}$ ]]

          actual_size="$(stat -c '%s' "${package}")"
          actual_sha="$(sha256sum "${package}" | awk '{print tolower($1)}')"
          [[ "${actual_size}" == "${expected_size}" ]]
          [[ "${actual_sha}" == "${expected_sha}" ]]

          tag="codex-desktop-${version}"
          title="Codex Desktop Windows x64 ${version}"
          notes='Official Microsoft Store MSIX staged for Gitee Go domestic mirroring. Z8 Launch verifies the declared size, SHA-256, and Windows signature before installation.'

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --title "${title}" --notes "${notes}" --latest=false
          else
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${title}" --notes "${notes}" --latest=false
          fi
          gh release upload "${tag}" "${package}" "${metadata}" --repo "${GITHUB_REPOSITORY}" --clobber

          echo "Published ${tag}: ${actual_size} bytes, SHA-256 ${actual_sha}"
