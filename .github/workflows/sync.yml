name: Sync official Codex Desktop and Codex++ to Cloudflare R2

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: z8-codex-domestic-mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-r2-config:
    name: Validate Cloudflare R2 configuration
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Check required R2 settings
        shell: bash
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is required}"
          : "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID secret is required}"
          : "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY secret is required}"
          : "${R2_BUCKET:?R2_BUCKET variable is required}"
          : "${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL variable is required}"
          if [[ "${R2_ACCOUNT_ID}" == cfat_* ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID must be the 32-hex account ID, not a Cloudflare API token (cfat_...)'
            exit 1
          fi
          if [[ ! "${R2_ACCOUNT_ID}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID must be the 32-hex account ID from the R2 S3 endpoint host'
            exit 1
          fi
          if [[ ! "${R2_BUCKET}" =~ ^[A-Za-z0-9._-]{1,63}$ ]]; then
            echo '::error::R2_BUCKET contains unsupported characters'
            exit 1
          fi
          if [[ "${R2_PUBLIC_BASE_URL}" != 'https://download.z8.hk' ]]; then
            echo '::error::R2_PUBLIC_BASE_URL must be exactly https://download.z8.hk'
            exit 1
          fi

  download-windows:
    name: Resolve official Codex Desktop Windows x64
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate-r2-config
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out resolver
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download and verify complete MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null
          $resolvedText = & pwsh -NoProfile -File scripts/resolve-codex-msix.ps1 -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw 'Microsoft Store resolver failed for x64' }
          $resolved = ($resolvedText -join "`n") | ConvertFrom-Json
          $candidates = @($resolved.urls)
          if ($candidates.Count -eq 0 -and $resolved.url) { $candidates = @($resolved.url) }
          $downloadCandidates = @()
          foreach ($candidate in $candidates) {
            $candidateUri = $null
            if (-not [Uri]::TryCreate([string]$candidate, [UriKind]::Absolute, [ref]$candidateUri) -or
                $candidateUri.Scheme -notin @('http', 'https') -or
                $candidateUri.Host -notmatch '(^|\.)dl\.delivery\.mp\.microsoft\.com$') { continue }
            $downloadCandidates += [string]$candidateUri.AbsoluteUri
            # Microsoft currently publishes HTTP Store URLs, while some
            # regions publish HTTPS URLs. Try the alternate scheme as a
            # bounded fallback for the same exact CDN host.
            $alternateBuilder = [UriBuilder]$candidateUri
            if ($candidateUri.Scheme -eq 'http') {
              $alternateBuilder.Scheme = 'https'
            } else {
              $alternateBuilder.Scheme = 'http'
            }
            $downloadCandidates += [string]$alternateBuilder.Uri.AbsoluteUri
          }
          $downloadCandidates = @($downloadCandidates | Select-Object -Unique)
          $outputName = 'Codex-windows-x64.msix'
          $outputPath = Join-Path $artifactRoot $outputName
          $downloaded = $false
          $signatureStatus = ''
          $packagePublisher = ''
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $signtool = Get-ChildItem -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'Windows SDK signtool.exe is required to verify the MSIX signature' }
          foreach ($candidate in $downloadCandidates) {
            if ([string]::IsNullOrWhiteSpace([string]$candidate)) { continue }
            $candidateUri = $null
            if (-not [Uri]::TryCreate([string]$candidate, [UriKind]::Absolute, [ref]$candidateUri) -or
                $candidateUri.Scheme -notin @('http', 'https') -or
                $candidateUri.Host -notmatch '(^|\.)dl\.delivery\.mp\.microsoft\.com$') { continue }
            Remove-Item -LiteralPath $outputPath -Force -ErrorAction SilentlyContinue
            $curlArgs = @(
              '-fsSL', '--retry', '4', '--retry-all-errors',
              '-A', 'Mozilla/5.0 (Z8-Launch domestic mirror)',
              '-e', 'https://openai.com/codex/for-work/',
              '-o', $outputPath, [string]$candidate
            )
            & curl.exe @curlArgs
            $downloadExit = $LASTEXITCODE
            if (($downloadExit -ne 0 -or -not (Test-Path -LiteralPath $outputPath)) -and
                $candidateUri.Scheme -eq 'https') {
              # A few Microsoft CDN edges have presented an incomplete chain
              # to hosted runners. Only retry without certificate validation
              # after the normal TLS attempt, and still require the package
              # identity plus signtool verification below.
              Remove-Item -LiteralPath $outputPath -Force -ErrorAction SilentlyContinue
              & curl.exe (@('--insecure') + $curlArgs)
              $downloadExit = $LASTEXITCODE
            }
            if ($downloadExit -ne 0 -or -not (Test-Path -LiteralPath $outputPath)) { continue }
            $size = (Get-Item -LiteralPath $outputPath).Length
            if ($size -lt 104857600) { continue }
            $expectedSize = [int64]($resolved.size)
            if ($expectedSize -gt 0 -and $size -ne $expectedSize) { continue }
            $hash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifestArchive = [System.IO.Compression.ZipFile]::OpenRead($outputPath)
            try {
              $manifestEntry = $manifestArchive.GetEntry('AppxManifest.xml')
              if ($null -eq $manifestEntry) { continue }
              $manifestReader = [System.IO.StreamReader]::new($manifestEntry.Open())
              try { [xml]$appxManifest = $manifestReader.ReadToEnd() } finally { $manifestReader.Dispose() }
              $identity = $appxManifest.Package.Identity
              $packagePublisher = [string]$identity.Publisher
              $packageVersion = [string]$identity.Version
              if ([string]$identity.Name -ne 'OpenAI.Codex' -or
                  $packagePublisher -ne 'CN=50BDFD77-8903-4850-9FFE-6E8522F64D5B' -or
                  $packageVersion -ne [string]$resolved.version) { continue }
            } finally {
              $manifestArchive.Dispose()
            }
            & $signtool.FullName verify /pa /all /tw $outputPath
            if ($LASTEXITCODE -ne 0) { continue }
            $signatureStatus = 'Valid'
            $downloaded = $true
            break
          }
          if (-not $downloaded) { throw 'Unable to download a complete Codex Desktop x64 MSIX' }
          $metadata = [ordered]@{
            schemaVersion = 1
            architecture = 'x64'
            version = [string]$resolved.version
            fileName = $outputName
            sizeBytes = $size
            sha256 = $hash
            signatureStatus = $signatureStatus
            publisher = $packagePublisher
            upstreamUrl = 'https://get.microsoft.com/installer/download/9PLM9XGG6VKS?cid=website_cta_psi'
            generatedAt = [DateTime]::UtcNow.ToString('o')
          }
          $metadata | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $artifactRoot 'Codex-windows-x64.json') -Encoding utf8
      - name: Store verified MSIX
        uses: actions/upload-artifact@v7
        with:
          name: codex-msix-x64
          path: artifacts/
          if-no-files-found: error
          # MSIX is already compressed; avoid spending runner time on a
          # second compression pass before the R2 publisher downloads it.
          compression-level: 0
          retention-days: 1

  mirror-codex-desktop:
    name: '[Disabled] Historical Codex Desktop Gitee mirror'
    # R2 is the only artifact transport. Keep this job as documented rollback
    # material, but never let the retired Gitee upload consume a runner slot.
    if: ${{ false }}
    needs: download-windows
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: z8hk
      GITEE_REPO: codex-mirror
      UPSTREAM_REPOSITORY: openai/codex
      UPSTREAM_RELEASE_URL: https://openai.com/codex/for-work/
      RAW_PART_BYTES: "8388608"
      UPLOAD_PARALLELISM: "8"
      VERIFY_PARALLELISM: "8"
    steps:
      - name: Check out publisher
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: codex-msix-x64
          path: staging
      - name: Publish verified Base64 parts and manifest
        shell: bash
        run: |
          set -euo pipefail
          metadata='staging/Codex-windows-x64.json'
          package="${GITHUB_WORKSPACE}/staging/Codex-windows-x64.msix"
          [[ "$(jq -r '.signatureStatus // empty' "${metadata}")" == 'Valid' ]]
          [[ "$(jq -r '.publisher // empty' "${metadata}")" == 'CN=50BDFD77-8903-4850-9FFE-6E8522F64D5B' ]]
          MIRROR_TAG="$(jq -r '.version // empty' "${metadata}")"
          MIRROR_VERSION="${MIRROR_TAG}"
          jq -n \
            --arg filename 'Codex-windows-x64.msix' \
            --arg path "${package}" \
            --arg upstreamUrl "$(jq -r '.upstreamUrl' "${metadata}")" \
            --arg sha256 "$(jq -r '.sha256' "${metadata}")" \
            --argjson sizeBytes "$(jq -r '.sizeBytes' "${metadata}")" \
            '[{filename:$filename,path:$path,upstreamUrl:$upstreamUrl,sizeBytes:$sizeBytes,sha256:$sha256}]' \
            > desktop-assets.json
          export MIRROR_TAG MIRROR_VERSION
          export ASSET_SPEC_FILE="${GITHUB_WORKSPACE}/desktop-assets.json"
          bash scripts/publish-gitee-mirror.sh

  mirror-codex-desktop-r2:
    name: Mirror Codex Desktop to Cloudflare R2
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: download-windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIRROR_ID: codex-mirror
      MIRROR_REPOSITORY: z8hk/codex-mirror
      R2_LATEST_KEY: z8-launch/codex-mirror/latest.json
      UPSTREAM_REPOSITORY: openai/codex
      UPSTREAM_RELEASE_URL: https://openai.com/codex/for-work/
      RAW_PART_BYTES: "50331648"
      UPLOAD_PARALLELISM: "8"
      VERIFY_PARALLELISM: "8"
    steps:
      - name: Check out publisher
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: codex-msix-x64
          path: staging
      - name: Publish raw R2 parts and stable pointer
        shell: bash
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          metadata='staging/Codex-windows-x64.json'
          package="${GITHUB_WORKSPACE}/staging/Codex-windows-x64.msix"
          MIRROR_TAG="$(jq -r '.version // empty' "${metadata}")"
          MIRROR_VERSION="${MIRROR_TAG}"
          jq -n \
            --arg filename 'Codex-windows-x64.msix' \
            --arg path "${package}" \
            --arg upstreamUrl "$(jq -r '.upstreamUrl' "${metadata}")" \
            --arg sha256 "$(jq -r '.sha256' "${metadata}")" \
            --argjson sizeBytes "$(jq -r '.sizeBytes' "${metadata}")" \
            '[{filename:$filename,path:$path,upstreamUrl:$upstreamUrl,sizeBytes:$sizeBytes,sha256:$sha256}]' \
            > desktop-assets.json
          export MIRROR_TAG MIRROR_VERSION
          export ASSET_SPEC_FILE="${GITHUB_WORKSPACE}/desktop-assets.json"
          bash scripts/publish-r2-mirror.sh

  mirror-codexplusplus:
    name: '[Disabled] Historical Codex++ Gitee mirror'
    # R2 is the only artifact transport. Keep this job as documented rollback
    # material, but never let the retired Gitee upload consume a runner slot.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: z8hk
      GITEE_REPO: codexplusplus-mirror
      UPSTREAM_REPOSITORY: BigPizzaV3/CodexPlusPlus
      RAW_PART_BYTES: "8388608"
      UPLOAD_PARALLELISM: "8"
      VERIFY_PARALLELISM: "8"
    steps:
      - name: Check out publisher
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download, verify, and mirror stable upstream assets
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(curl -fsSL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/BigPizzaV3/CodexPlusPlus/releases/latest')"
          jq -e '.draft == false and .prerelease == false' <<<"${upstream}" >/dev/null
          MIRROR_TAG="$(jq -r '.tag_name // empty' <<<"${upstream}")"
          MIRROR_VERSION="${MIRROR_TAG#v}"
          UPSTREAM_RELEASE_URL="$(jq -r '.html_url // empty' <<<"${upstream}")"
          [[ "${MIRROR_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${UPSTREAM_RELEASE_URL}" == "https://github.com/BigPizzaV3/CodexPlusPlus/releases/tag/${MIRROR_TAG}" ]]
          mkdir -p upstream-assets
          specs='[]'
          for suffix in windows-x64-setup.exe macos-x64.dmg macos-arm64.dmg; do
            filename="CodexPlusPlus-${MIRROR_VERSION}-${suffix}"
            asset="$(jq -c --arg filename "${filename}" '[.assets[] | select(.name == $filename)] | if length == 1 then .[0] else error("asset missing or duplicated") end' <<<"${upstream}")"
            url="$(jq -r '.browser_download_url' <<<"${asset}")"
            expected_url="https://github.com/BigPizzaV3/CodexPlusPlus/releases/download/${MIRROR_TAG}/${filename}"
            [[ "${url}" == "${expected_url}" ]]
            expected_size="$(jq -r '.size' <<<"${asset}")"
            expected_sha="$(jq -r '.digest // empty | sub("^sha256:"; "") | ascii_downcase' <<<"${asset}")"
            [[ "${expected_size}" =~ ^[1-9][0-9]*$ ]]
            [[ "${expected_sha}" =~ ^[0-9a-f]{64}$ ]]
            path="${GITHUB_WORKSPACE}/upstream-assets/${filename}"
            curl -fsSL --retry 4 --retry-all-errors -o "${path}" "${url}"
            [[ "$(stat -c '%s' "${path}")" == "${expected_size}" ]]
            [[ "$(sha256sum "${path}" | awk '{print tolower($1)}')" == "${expected_sha}" ]]
            spec="$(jq -n --arg filename "${filename}" --arg path "${path}" --arg upstreamUrl "${url}" --arg sha256 "${expected_sha}" --argjson sizeBytes "${expected_size}" '{filename:$filename,path:$path,upstreamUrl:$upstreamUrl,sizeBytes:$sizeBytes,sha256:$sha256}')"
            specs="$(jq -c --argjson spec "${spec}" '. + [$spec]' <<<"${specs}")"
          done
          printf '%s\n' "${specs}" > codexplusplus-assets.json
          export MIRROR_TAG MIRROR_VERSION UPSTREAM_RELEASE_URL
          export ASSET_SPEC_FILE="${GITHUB_WORKSPACE}/codexplusplus-assets.json"
          bash scripts/publish-gitee-mirror.sh

  mirror-codexplusplus-r2:
    name: Mirror Codex++ stable release to Cloudflare R2
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: validate-r2-config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIRROR_ID: codexplusplus-mirror
      MIRROR_REPOSITORY: z8hk/codexplusplus-mirror
      R2_LATEST_KEY: z8-launch/codexplusplus-mirror/latest.json
      UPSTREAM_REPOSITORY: BigPizzaV3/CodexPlusPlus
      RAW_PART_BYTES: "50331648"
      UPLOAD_PARALLELISM: "8"
      VERIFY_PARALLELISM: "8"
    steps:
      - name: Check out publisher
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download, verify, and publish stable upstream assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          upstream="$(curl -fsSL --retry 4 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/BigPizzaV3/CodexPlusPlus/releases/latest')"
          jq -e '.draft == false and .prerelease == false' <<<"${upstream}" >/dev/null
          MIRROR_TAG="$(jq -r '.tag_name // empty' <<<"${upstream}")"
          MIRROR_VERSION="${MIRROR_TAG#v}"
          UPSTREAM_RELEASE_URL="$(jq -r '.html_url // empty' <<<"${upstream}")"
          [[ "${MIRROR_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${UPSTREAM_RELEASE_URL}" == "https://github.com/BigPizzaV3/CodexPlusPlus/releases/tag/${MIRROR_TAG}" ]]
          mkdir -p upstream-assets asset-specs
          pids=()
          asset_index=0
          for suffix in windows-x64-setup.exe macos-x64.dmg macos-arm64.dmg; do
            asset_index=$((asset_index + 1))
            (
              set -euo pipefail
              filename="CodexPlusPlus-${MIRROR_VERSION}-${suffix}"
              asset="$(jq -c --arg filename "${filename}" '[.assets[] | select(.name == $filename)] | if length == 1 then .[0] else error("asset missing or duplicated") end' <<<"${upstream}")"
              url="$(jq -r '.browser_download_url' <<<"${asset}")"
              expected_url="https://github.com/BigPizzaV3/CodexPlusPlus/releases/download/${MIRROR_TAG}/${filename}"
              [[ "${url}" == "${expected_url}" ]]
              expected_size="$(jq -r '.size' <<<"${asset}")"
              expected_sha="$(jq -r '.digest // empty | sub("^sha256:"; "") | ascii_downcase' <<<"${asset}")"
              [[ "${expected_size}" =~ ^[1-9][0-9]*$ ]]
              [[ "${expected_sha}" =~ ^[0-9a-f]{64}$ ]]
              path="${GITHUB_WORKSPACE}/upstream-assets/${filename}"
              curl -fsSL --retry 4 --retry-all-errors -o "${path}" "${url}"
              [[ "$(stat -c '%s' "${path}")" == "${expected_size}" ]]
              [[ "$(sha256sum "${path}" | awk '{print tolower($1)}')" == "${expected_sha}" ]]
              jq -n --arg filename "${filename}" --arg path "${path}" --arg upstreamUrl "${url}" --arg sha256 "${expected_sha}" --argjson sizeBytes "${expected_size}" \
                '{filename:$filename,path:$path,upstreamUrl:$upstreamUrl,sizeBytes:$sizeBytes,sha256:$sha256}' \
                > "asset-specs/$(printf '%02d' "${asset_index}").json"
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "${pid}"
          done
          specs="$(jq -s -c 'sort_by(.filename)' asset-specs/*.json)"
          printf '%s\n' "${specs}" > codexplusplus-assets.json
          export MIRROR_TAG MIRROR_VERSION UPSTREAM_RELEASE_URL
          export ASSET_SPEC_FILE="${GITHUB_WORKSPACE}/codexplusplus-assets.json"
          bash scripts/publish-r2-mirror.sh
