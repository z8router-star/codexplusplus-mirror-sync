name: Sync official Codex Desktop and Codex++ to Gitee

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: z8-codex-mirror-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Mirror ${{ matrix.project.label }}
    runs-on: ${{ matrix.project.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project:
          - id: codex-desktop
            label: Codex Desktop Windows x64
            gitee_repo: codex-mirror
            asset_mode: codex_desktop_x64
            runner: ubuntu-latest
          - id: codex-desktop-arm64
            label: Codex Desktop Windows arm64
            gitee_repo: codex-mirror-arm64
            asset_mode: codex_desktop_arm64
            runner: ubuntu-latest
          - id: codex-desktop-macos
            label: Codex Desktop macOS
            gitee_repo: codex-mirror-macos
            asset_mode: codex_desktop_macos
            runner: macos-latest
          - id: codexplusplus
            label: CodexPlusPlus
            upstream: BigPizzaV3/CodexPlusPlus
            gitee_repo: codexplusplus-mirror
            asset_mode: codexplusplus
            runner: ubuntu-latest
    env:
      GITEE_OWNER: z8hk
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPO: ${{ matrix.project.gitee_repo }}
      ASSET_MODE: ${{ matrix.project.asset_mode }}
      CHUNK_BYTES: "47185920"

    steps:
      - name: Check out resolver
        uses: actions/checkout@v4

      - name: Verify and publish latest official bytes
        shell: bash
        run: |
          set -euo pipefail
          : "${GITEE_TOKEN:?Set the GITEE_TOKEN repository secret first}"

          api="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          auth="Authorization: token ${GITEE_TOKEN}"
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT
          selected_assets='[]'
          manifest_assets='[]'

          if [[ "${ASSET_MODE}" == "codexplusplus" ]]; then
            upstream_repo='BigPizzaV3/CodexPlusPlus'
            upstream="$(curl -fsSL --retry 4 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${upstream_repo}/releases/latest")"
            jq -e '.draft == false and .prerelease == false' <<<"${upstream}" >/dev/null
            tag="$(jq -r '.tag_name // empty' <<<"${upstream}")"
            version="${tag#v}"
            release_url="$(jq -r '.html_url // empty' <<<"${upstream}")"
            [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid upstream tag: ${tag}"; exit 1; }
            selected_assets="$(jq -c --arg version "${version}" '[.assets[] | select(.name == ("CodexPlusPlus-" + $version + "-windows-x64-setup.exe") or .name == ("CodexPlusPlus-" + $version + "-macos-x64.dmg") or .name == ("CodexPlusPlus-" + $version + "-macos-arm64.dmg"))] | map({name:.name,source_url:.browser_download_url,source_urls:[.browser_download_url],upstream_url:.browser_download_url,expected_size:.size,expected_sha:(.digest // "" | sub("^sha256:"; ""))})' <<<"${upstream}")"
            [[ "$(jq 'length' <<<"${selected_assets}")" == 3 ]] || { echo "::error::CodexPlusPlus release is missing a required target"; exit 1; }
          else
            upstream_repo='openai/codex'
            release_url='https://openai.com/codex/for-work/'
            store_url='https://get.microsoft.com/installer/download/9PLM9XGG6VKS?cid=website_cta_psi'
            desktop_version=''
            case "${ASSET_MODE}" in
              codex_desktop_x64|codex_desktop_arm64)
                architecture="${ASSET_MODE##*_}"
                if resolved="$(pwsh -NoProfile -File scripts/resolve-codex-msix.ps1 -Architecture "${architecture}")"; then
                  msix_name="Codex-windows-${architecture}.msix"
          selected_assets="$(jq -c --arg name "${msix_name}" --arg source "$(jq -r '.url' <<<"${resolved}")" --arg upstream "${store_url}" --argjson sources "$(jq -c '.urls // [.url]' <<<"${resolved}")" --argjson size "$(jq -r '.size' <<<"${resolved}")" '. + [{name:$name,source_url:$source,source_urls:$sources,upstream_url:$upstream,expected_size:$size,expected_sha:""}]' <<<"${selected_assets}")"
                  desktop_version="$(jq -r '.version // empty' <<<"${resolved}")"
                else
                  echo "::error::Microsoft Store did not expose a stable ${architecture} Codex package"
                  exit 1
                fi
                ;;
              codex_desktop_macos)
                selected_assets="$(jq -c --arg arm 'https://persistent.oaistatic.com/codex-app-prod/Codex.dmg' '. + [{name:"Codex-mac-arm64.dmg",source_url:$arm,source_urls:[$arm],upstream_url:$arm,expected_size:0,expected_sha:""}]' <<<"${selected_assets}")"
                ;;
              *)
                echo "::error::Unsupported desktop asset mode: ${ASSET_MODE}"
                exit 1
                ;;
            esac
            required_assets=1
            [[ "${ASSET_MODE}" == 'codex_desktop_macos' ]] && required_assets=1
            [[ "$(jq 'length' <<<"${selected_assets}")" -ge "${required_assets}" ]] || { echo "::error::No Codex Desktop package was resolved"; exit 1; }
            if [[ -n "${desktop_version}" ]]; then
              version="${desktop_version}"
            else
              version="desktop-$(date -u +%Y%m%d)"
            fi
            tag="${version}"
          fi

          [[ "${version}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid mirror version"; exit 1; }

          ensure_master_branch() {
            local branch_status bootstrap_payload bootstrap_content
            branch_status="$(curl -sS -o /dev/null -w '%{http_code}' -H "${auth}" "${api}/branches/master")"
            [[ "${branch_status}" == 200 ]] && return 0
            [[ "${branch_status}" == 404 ]] || { echo "::error::Unable to inspect Gitee master branch (HTTP ${branch_status})"; return 1; }
            bootstrap_content="WjggTGF1bmNoIG1pcnJvciBib290c3RyYXAuCg=="
            bootstrap_payload="$(jq -n --arg message 'initialize Z8 Launch mirror' --arg content "${bootstrap_content}" --arg branch master '{message:$message,content:$content,branch:$branch}')"
            curl -fsSL --retry 4 --retry-all-errors -X POST -H "${auth}" -H 'Content-Type: application/json' -d "${bootstrap_payload}" "${api}/contents/.z8-launch-mirror" >/dev/null
          }

          ensure_master_branch

          release_json="${work}/release.json"
          status="$(curl -sS -o "${release_json}" -w '%{http_code}' -H "${auth}" "${api}/releases/tags/${tag}")"
          if [[ "${status}" == 200 ]]; then
            release_id="$(jq -r '.id // empty' "${release_json}")"
            [[ "${release_id}" =~ ^[0-9]+$ ]] || status=404
          fi
          if [[ "${status}" == 404 ]]; then
            tag_json="${work}/tag.json"
            tag_status="$(curl -sS -o "${tag_json}" -w '%{http_code}' -H "${auth}" "${api}/tags/${tag}")"
            if [[ "${tag_status}" == 404 ]]; then
              tag_payload="$(jq -n --arg tag "${tag}" --arg refs master '{tag_name:$tag,refs:$refs}')"
              tag_status="$(curl -sS -o "${tag_json}" -w '%{http_code}' --retry 4 --retry-all-errors -X POST -H "${auth}" -H 'Content-Type: application/json' -d "${tag_payload}" "${api}/tags")"
            fi
            [[ "${tag_status}" =~ ^2[0-9][0-9]$ ]] || { echo "::error::Unable to ensure Gitee tag ${tag} (HTTP ${tag_status})"; jq -c 'del(.message,.detail)' "${tag_json}" 2>/dev/null || true; exit 1; }
            body="Mirrored official bytes from ${release_url}. Every asset is SHA-256 verified before upload; large files are split below Gitee's per-file limit and described in latest.json."
            payload="$(jq -n --arg tag "${tag}" --arg name "${{ matrix.project.label }} ${version}" --arg body "${body}" '{tag_name:$tag,name:$name,body:$body,target_commitish:"master",prerelease:false}')"
            create_json="${work}/create-release.json"
            create_status="$(curl -sS -o "${create_json}" -w '%{http_code}' --retry 4 --retry-all-errors -X POST -H "${auth}" -H 'Content-Type: application/json' -d "${payload}" "${api}/releases")"
            release_id="$(jq -r '.id // .release.id // .data.id // empty' "${create_json}")"
            if [[ ! "${release_id}" =~ ^[0-9]+$ ]]; then
              echo "::error::Gitee release creation failed (HTTP ${create_status})"
              jq -c '{keys:(keys // []),id:.id,message:.message,detail:.detail,error:.error,errors:.errors}' "${create_json}" 2>/dev/null || head -c 1000 "${create_json}" || true
            fi
          elif [[ "${release_id}" =~ ^[0-9]+$ ]]; then
            :
          else
            cat "${release_json}"
            exit 1
          fi
          [[ "${release_id}" =~ ^[0-9]+$ ]] || { echo "::error::Invalid Gitee release id"; exit 1; }

          delete_all_assets() {
            local list id existing
            list="$(curl -fsSL --retry 4 --retry-all-errors -H "${auth}" "${api}/releases/${release_id}/attach_files?per_page=100")"
            while IFS=$'\t' read -r id existing; do
              [[ -n "${id}" && "${id}" != null ]] || continue
              curl -fsSL --retry 4 --retry-all-errors -X DELETE -H "${auth}" "${api}/releases/${release_id}/attach_files/${id}" >/dev/null
            done < <(jq -r '.[] | [.id, .name] | @tsv' <<<"${list}")
          }

          # A failed run can leave a partial set of chunks. Start each release
          # refresh from an empty attachment list so the manifest is atomic.
          delete_all_assets

          delete_named_asset() {
            local name="$1" list id existing
            list="$(curl -fsSL --retry 4 --retry-all-errors -H "${auth}" "${api}/releases/${release_id}/attach_files?per_page=100")"
            while IFS=$'\t' read -r id existing; do
              [[ -n "${id}" && "${id}" != null ]] || continue
              [[ "${existing}" == "${name}" ]] && curl -fsSL --retry 4 --retry-all-errors -X DELETE -H "${auth}" "${api}/releases/${release_id}/attach_files/${id}" >/dev/null
            done < <(jq -r '.[] | [.id, .name] | @tsv' <<<"${list}")
          }

          download_upstream_asset() {
            local url="$1" file="$2"
            local -a options=(-fsSL --retry 4 --retry-all-errors -A 'Mozilla/5.0 (Z8-Launch mirror sync)' -e 'https://openai.com/codex/for-work/')
            # Microsoft CDN occasionally presents an incomplete public chain
            # to hosted Linux runners. The MSIX is still checked by its exact
            # bytes and Windows Authenticode policy before Z8 Launch installs it.
            if [[ "${url}" == *dl.delivery.mp.microsoft.com/* ]]; then
              options+=(--insecure)
              if curl "${options[@]}" -o "${file}" "${url}"; then
                return 0
              fi
              # Store currently returns HTTP URLs. Retry the alternate
              # protocol because some runner egress paths reject one side.
              local alternate="${url}"
              if [[ "${url}" == https://* ]]; then
                alternate="http://${url#https://}"
              elif [[ "${url}" == http://* ]]; then
                alternate="https://${url#http://}"
              fi
              curl "${options[@]}" -o "${file}" "${alternate}"
              return $?
            fi
            if curl "${options[@]}" -o "${file}" "${url}"; then
              return 0
            fi
            # Keep a small query-string fallback for static assets whose edge
            # cache occasionally returns a transient 404 for the bare path.
            local separator='?'
            [[ "${url}" == *\?* ]] && separator='&'
            curl "${options[@]}" -o "${file}" "${url}${separator}download=1"
          }

          upload_and_verify() {
            local file="$1" name="$2" expected_size="$3" expected_sha="$4"
            delete_named_asset "${name}"
            local upload_json="${work}/upload-${name//\//_}.json" upload_status
            upload_status="$(curl -sS -o "${upload_json}" -w '%{http_code}' --retry 4 --retry-all-errors -X POST -H "${auth}" -F "file=@${file};filename=${name}" "${api}/releases/${release_id}/attach_files")"
            [[ "${upload_status}" =~ ^2[0-9][0-9]$ ]] || {
              echo "::error::Gitee attachment upload failed for ${name} (HTTP ${upload_status})" >&2
              jq -c '{message:.message,error:.error,errors:.errors}' "${upload_json}" >&2 2>/dev/null || head -c 1000 "${upload_json}" >&2 || true
              return 1
            }
            local mirror_url="https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/download/${tag}/${name}"
            local mirror_file="${work}/verify-${name//\//_}" mirror_size mirror_sha
            local mirror_status
            mirror_status="$(curl -sS -L -o "${mirror_file}" -w '%{http_code}' --retry 4 --retry-all-errors "${mirror_url}")"
            [[ "${mirror_status}" =~ ^2[0-9][0-9]$ ]] || { echo "::error::Gitee attachment verification download failed for ${name} (HTTP ${mirror_status})" >&2; return 1; }
            mirror_size="$(stat -c '%s' "${mirror_file}")"
            mirror_sha="$(sha256sum "${mirror_file}" | awk '{print tolower($1)}')"
            [[ "${mirror_size}" == "${expected_size}" && "${mirror_sha}" == "${expected_sha,,}" ]] || { echo "::error::Gitee checksum mismatch: ${name}" >&2; return 1; }
            printf '%s\n' "${mirror_url}"
          }

          while IFS= read -r asset; do
            name="$(jq -r '.name' <<<"${asset}")"
            source_url="$(jq -r '.source_url' <<<"${asset}")"
            source_urls="$(jq -c '.source_urls // [.source_url]' <<<"${asset}")"
            upstream_url="$(jq -r '.upstream_url' <<<"${asset}")"
            expected_size="$(jq -r '.expected_size' <<<"${asset}")"
            expected_sha="$(jq -r '.expected_sha' <<<"${asset}")"
            file="${work}/${name}"
            downloaded=false
            while IFS= read -r candidate_url; do
              [[ -n "${candidate_url}" ]] || continue
              if download_upstream_asset "${candidate_url}" "${file}"; then
                downloaded=true
                source_url="${candidate_url}"
                break
              fi
            done < <(jq -r '.[]' <<<"${source_urls}")
            [[ "${downloaded}" == true ]] || { echo "::error::Unable to download upstream asset: ${name}"; exit 1; }
            actual_size="$(stat -c '%s' "${file}")"
            actual_sha="$(sha256sum "${file}" | awk '{print tolower($1)}')"
            [[ "${actual_size}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Empty upstream asset: ${name}"; exit 1; }
            [[ "${expected_size}" == 0 || "${actual_size}" == "${expected_size}" ]] || { echo "::error::Upstream size mismatch: ${name}"; exit 1; }
            [[ -z "${expected_sha}" || "${actual_sha}" == "${expected_sha,,}" ]] || { echo "::error::Upstream checksum mismatch: ${name}"; exit 1; }

            parts='[]'
            chunk_bytes="${CHUNK_BYTES}"
            if [[ "${ASSET_MODE}" == "codexplusplus" && "${name}" == *windows-x64-setup.exe ]]; then
              # Gitee's malware scanner rejects the complete installer even
              # when the attachment has a non-executable suffix. Uploading
              # chunks keeps each attachment non-runnable; Z8 Launch restores
              # the logical .exe from the verified parts.
              chunk_bytes=10485760
            fi
            if (( actual_size <= chunk_bytes )); then
              mirror_url="$(upload_and_verify "${file}" "${name}" "${actual_size}" "${actual_sha}")"
              parts="$(jq -c --arg filename "${name}" --arg url "${mirror_url}" --argjson size "${actual_size}" --arg sha "${actual_sha}" '. + [{filename:$filename,mirrorUrl:$url,sizeBytes:$size,sha256:$sha}]' <<<"${parts}")"
            else
              chunk_dir="${work}/chunks-${name}"
              mkdir -p "${chunk_dir}"
              split -b "${chunk_bytes}" -d -a 4 "${file}" "${chunk_dir}/part-"
              index=1
              for chunk in "${chunk_dir}"/part-*; do
                chunk_name="${name}.part-$(printf '%04d' "${index}")"
                chunk_size="$(stat -c '%s' "${chunk}")"
                chunk_sha="$(sha256sum "${chunk}" | awk '{print tolower($1)}')"
                mirror_url="$(upload_and_verify "${chunk}" "${chunk_name}" "${chunk_size}" "${chunk_sha}")"
                parts="$(jq -c --arg filename "${chunk_name}" --arg url "${mirror_url}" --argjson size "${chunk_size}" --arg sha "${chunk_sha}" '. + [{filename:$filename,mirrorUrl:$url,sizeBytes:$size,sha256:$sha}]' <<<"${parts}")"
                index=$((index + 1))
              done
            fi
            manifest_assets="$(jq -c --arg filename "${name}" --arg upstream "${upstream_url}" --argjson size "${actual_size}" --arg sha "${actual_sha}" --argjson parts "${parts}" '. + [{filename:$filename,upstreamUrl:$upstream,sizeBytes:$size,sha256:$sha,parts:$parts}]' <<<"${manifest_assets}")"
          done < <(jq -c '.[]' <<<"${selected_assets}")

          manifest="${work}/latest.json"
          jq -n \
            --arg upstream "${upstream_repo}" \
            --arg tag "${tag}" \
            --arg version "${version}" \
            --arg releaseUrl "${release_url}" \
            --arg mirrorRepo "${GITEE_OWNER}/${GITEE_REPO}" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson assets "${manifest_assets}" \
            '{schemaVersion:2,upstreamRepository:$upstream,tag:$tag,version:$version,upstreamReleaseUrl:$releaseUrl,mirrorRepository:$mirrorRepo,generatedAt:$generatedAt,assets:$assets}' > "${manifest}"
          manifest_size="$(stat -c '%s' "${manifest}")"
          manifest_sha="$(sha256sum "${manifest}" | awk '{print tolower($1)}')"
          # latest.json is the authoritative manifest consumed by Z8 Launch.
          # Keep it in the repository rather than as a release attachment;
          # Gitee's attachment CDN can reject small JSON files after a large
          # upload even though all binary chunks have verified successfully.
          echo "Manifest SHA-256: ${manifest_sha} (${manifest_size} bytes)"

          content="$(base64 -w0 "${manifest}")"
          existing="$(curl -sS -H "${auth}" "${api}/contents/latest.json?ref=master")"
          sha="$(jq -r 'if type == "object" then (.sha // empty) else empty end' <<<"${existing}")"
          payload="$(jq -n --arg message "sync latest ${version}" --arg content "${content}" --arg branch master --arg sha "${sha}" 'if $sha == "" then {message:$message,content:$content,branch:$branch} else {message:$message,content:$content,branch:$branch,sha:$sha} end')"
          latest_json_response="${work}/latest-json-response.json"
          latest_json_method='POST'
          [[ -n "${sha}" ]] && latest_json_method='PUT'
          latest_json_status="$(curl -sS -o "${latest_json_response}" -w '%{http_code}' --retry 4 --retry-all-errors -X "${latest_json_method}" -H "${auth}" -H 'Content-Type: application/json' -d "${payload}" "${api}/contents/latest.json")"
          [[ "${latest_json_status}" =~ ^2[0-9][0-9]$ ]] || {
            echo "::error::Gitee latest.json update failed (HTTP ${latest_json_status})" >&2
            jq -c '{keys:(keys // []),message:.message,detail:.detail,error:.error,errors:.errors}' "${latest_json_response}" >&2 2>/dev/null || head -c 1000 "${latest_json_response}" >&2 || true
            exit 1
          }
          echo "Synced ${upstream_repo} ${tag} to https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${tag}"
